<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>柴犬大冒險</title>
    <style>
        /* 基礎版面設計：讓遊戲置中並加上天空背景 */
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #87CEEB; /* 天空藍 */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            flex-direction: column; 
        }
        /* 遊戲畫布設計 */
        canvas { 
            background-color: #E0F7FA; 
            border: 4px solid #8B4513; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        }
        /* 提示文字 */
        .instructions { 
            margin-top: 15px; 
            font-family: "微軟正黑體", sans-serif; 
            color: #333; 
            font-size: 1.2rem;
            font-weight: bold; 
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- 遊戲畫布：寬度800，高度400 -->
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="instructions">操作說明：使用鍵盤【←】【→】左右移動，【↑】跳躍！</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 🐕 柴犬角色設定
        const shiba = {
            x: 50,            // 初始 X 座標
            y: 200,           // 初始 Y 座標
            size: 40,         // 大小
            dx: 0,            // X 軸移動速度
            dy: 0,            // Y 軸移動速度 (跳躍/墜落)
            speed: 6,         // 左右奔跑的最高速度
            jumpPower: -14,   // 跳躍力道 (負值代表往上)
            grounded: false   // 是否踩在地上
        };

        // 🌍 物理環境設定
        const gravity = 0.8;  // 地心引力
        const groundHeight = 50; // 地板高度
        const keys = { right: false, left: false, up: false }; // 按鍵狀態

        // ⌨️ 監聽鍵盤按下事件
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'ArrowUp') {
                // 只有在地面上才能跳躍，防止「二段跳」
                if (shiba.grounded) {
                    shiba.dy = shiba.jumpPower;
                    shiba.grounded = false;
                }
            }
        });

        // ⌨️ 監聽鍵盤放開事件
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'ArrowLeft') keys.left = false;
        });

        // ⚙️ 遊戲邏輯更新
        function update() {
            // 處理左右移動
            if (keys.right) shiba.dx = shiba.speed;
            else if (keys.left) shiba.dx = -shiba.speed;
            else shiba.dx = 0; // 沒按按鍵時停止

            // 處理物理與重力
            shiba.dy += gravity; // 持續受到重力往下壓
            shiba.x += shiba.dx;
            shiba.y += shiba.dy;

            // 地板碰撞偵測
            const groundY = canvas.height - groundHeight;
            if (shiba.y + shiba.size > groundY) {
                shiba.y = groundY - shiba.size; // 把柴犬拉回地面上
                shiba.dy = 0;                   // 垂直速度歸零
                shiba.grounded = true;          // 狀態改為著地
            } else {
                shiba.grounded = false;
            }

            // 牆壁邊界限制 (不讓柴犬跑出螢幕外)
            if (shiba.x < 0) shiba.x = 0;
            if (shiba.x + shiba.size > canvas.width) shiba.x = canvas.width - shiba.size;
        }

        // 🎨 畫面繪製
        function draw() {
            // 每次畫新影格前，先清除上一格的畫面
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 畫出咖啡色泥土與綠色草皮
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 15);

            // 畫出主角柴犬 (這裡使用 Emoji 替代複雜的圖片)
            ctx.font = '45px Arial';
            // 因為 text 繪圖基準點在左下角，所以 Y 座標稍微加上微調值
            ctx.fillText('🐕', shiba.x, shiba.y + 38); 
        }

        // 🔄 遊戲主迴圈
        function gameLoop() {
            update(); // 1. 算數學 (更新座標)
            draw();   // 2. 畫畫面
            requestAnimationFrame(gameLoop); // 3. 呼叫下一格
        }

        // 🚀 啟動遊戲
        gameLoop();
    </script>
</body>
</html>
